<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket Purchase - Coldplay Tour 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buy Tickets - Coldplay Live 2025</h1>
    <form id="ticketForm">
      <label for="concertId">Concert ID</label>
      <input type="number" id="concertId" value="1" required />

      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="phone">Phone</label>
      <input type="tel" id="phone" required />

      <label for="quantity">Quantity (1-10)</label>
      <input type="number" id="quantity" min="1" max="10" required />

      <label for="creditCard">Credit Card</label>
      <input type="text" id="creditCard" required />

      <label for="expiration">Expiration (MM/YY)</label>
      <input type="text" id="expiration" required />

      <label for="securityCode">Security Code</label>
      <input type="text" id="securityCode" maxlength="3" required />

      <label for="address">Address</label>
      <input type="text" id="address" required />

      <label for="city">City</label>
      <input type="text" id="city" required />

      <label for="province">Province</label>
      <input type="text" id="province" required />

      <label for="postalCode">Postal Code</label>
      <input type="text" id="postalCode" required />

      <label for="country">Country</label>
      <input type="text" id="country" required />

      <button type="submit">Submit Ticket</button>
    </form>
    <p id="result" style="text-align: center; color: green; margin-top: 20px;"></p>
  </div>

  <script>
    document.getElementById("ticketForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const payload = {
        concertId: parseInt(document.getElementById("concertId").value),
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        quantity: parseInt(document.getElementById("quantity").value),
        creditCard: document.getElementById("creditCard").value,
        expiration: document.getElementById("expiration").value,
        securityCode: document.getElementById("securityCode").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        province: document.getElementById("province").value,
        postalCode: document.getElementById("postalCode").value,
        country: document.getElementById("country").value,
      };

      try {
        const response = await fetch("https://localhost:7109/api/tickets", {

          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        const resultText = document.getElementById("result");

        if (response.ok) {
          const data = await response.text();
          resultText.innerText = "✅ " + data;
        } else {
          const err = await response.text();
          resultText.style.color = "red";
          resultText.innerText = "❌ " + err;
        }
      } catch (error) {
        console.error(error);
        document.getElementById("result").innerText = "❌ Failed to submit the form.";
      }
    });
  </script>
</body>
</html>
